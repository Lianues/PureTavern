name: Build HarmonyOS NEXT HAP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pure-tavern-harmony-hap
  cancel-in-progress: false

env:
  HMOS_CLI_VERSION: 0.0.1

jobs:
  harmony-hap:
    name: HarmonyOS NEXT unsigned HAP
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package version
        run: node -p '"RELEASE_VERSION=" + require("./package.json").version' >> "$GITHUB_ENV"

      - name: Apply version and build generic web app
        run: |
          node scripts/set-release-version.mjs "$RELEASE_VERSION"
          pnpm build

      - name: Install pinned HarmonyOS Linux command-line tools
        run: npm install --prefix "$RUNNER_TEMP/hmos-cli" "@hmtools/hmos-cli-lite-linux@$HMOS_CLI_VERSION"

      - name: Discover hvigor and ohpm
        run: node apps/harmony/scripts/discover-toolchain.mjs "$RUNNER_TEMP/hmos-cli/node_modules/@hmtools/hmos-cli-lite-linux" >> "$GITHUB_ENV"

      - name: Install Harmony project dependencies
        run: node apps/harmony/scripts/install-ohpm.mjs

      - name: Build unsigned release HAP
        run: pnpm --dir apps/harmony build:hap

      - name: Stage normalized HAP
        run: node apps/harmony/scripts/stage-hap.mjs "$RELEASE_VERSION" apps/harmony/entry/build release

      - name: Upload HarmonyOS NEXT HAP
        uses: actions/upload-artifact@v4
        with:
          name: PureTavern-harmonyos-next-arm64-unsigned-${{ github.run_number }}
          path: release/*.hap
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
