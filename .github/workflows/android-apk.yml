name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PURE_TAVERN_VERSION_CODE: ${{ github.run_number }}
      PURE_TAVERN_VERSION_NAME: 0.1.0-ci.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build generic web app and Android shell
        run: pnpm android:debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PureTavern-android-debug-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
