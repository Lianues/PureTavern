name: Build Desktop Bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }} bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
            bundles: nsis
            rust_target: ''
            target_args: ''
            release_root: apps/desktop/src-tauri/target/release
          - name: macOS x64
            os: macos-latest
            platform: macos
            arch: x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
            target_args: --target x86_64-apple-darwin
            release_root: apps/desktop/src-tauri/target/x86_64-apple-darwin/release
          - name: macOS arm64
            os: macos-latest
            platform: macos
            arch: arm64
            bundles: dmg
            rust_target: aarch64-apple-darwin
            target_args: --target aarch64-apple-darwin
            release_root: apps/desktop/src-tauri/target/aarch64-apple-darwin/release
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            bundles: appimage,deb,rpm
            rust_target: ''
            target_args: ''
            release_root: apps/desktop/src-tauri/target/release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install explicit Rust target
        if: matrix.rust_target != ''
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build generic web app
        run: pnpm build

      - name: Read package version
        shell: bash
        run: node -p '"RELEASE_VERSION=" + require("./package.json").version' >> "$GITHUB_ENV"

      - name: Build desktop bundle
        run: pnpm --filter @pure-tavern/desktop exec tauri build --ci --no-sign --bundles "${{ matrix.bundles }}" ${{ matrix.target_args }}

      - name: Stage normalized desktop assets
        run: node scripts/stage-desktop-release.mjs "${{ matrix.platform }}" "${{ matrix.arch }}" "${{ env.RELEASE_VERSION }}" "${{ matrix.release_root }}" release

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: PureTavern-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
